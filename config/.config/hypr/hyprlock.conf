general {
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_size = 7
    blur_passes = 3
    noise = 0.0117
    contrast = 0.8917
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans
    position = 0, -260
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 90
    font_family = Noto Sans
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = Type to unlock...
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo '<span foreground="#ff8585">Failed attempts: $(cat /tmp/hyprlock_fails || echo 0)</span>'
    font_size = 14
    font_family = Noto Sans
    position = 0, 30
    halign = center
    valign = bottom
}
