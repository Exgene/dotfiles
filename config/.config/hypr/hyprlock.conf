# Hyprlock config themed from wallust, without blur.

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $background
    blur_passes = 0
    blur_size = 0
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0
    vibrancy_darkness = 0
}

shape {
    monitor =
    size = 760, 420
    color = rgba(10, 12, 18, 0.56)
    rounding = 22
    border_size = 2
    border_color = rgba(125, 125, 125, 0.35)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 760, 420
    color = rgba(0, 0, 0, 0.18)
    rounding = 22
    border_size = 0
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 92
    font_family = Noto Sans
    position = 0, -114
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $color12
    font_size = 20
    font_family = Noto Sans
    position = 0, -46
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = $color7
    font_size = 19
    font_family = Noto Sans
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = 6
    outer_color = $color4
    inner_color = rgba(18, 24, 38, 0.78)
    font_color = $foreground
    fade_on_empty = true
    placeholder_text = <i>Enter password</i>
    hide_input = false
    check_color = $color2
    fail_color = $color11
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $color10
    numlock_color = -1
    bothlock_color = -1
    position = 0, 98
    halign = center
    valign = center
}

label {
    monitor =
    text = Caps Lock warning shows in amber
    color = $color8
    font_size = 13
    font_family = Noto Sans
    position = 0, 146
    halign = center
    valign = center
}

label {
    monitor =
    text = CTRL+ALT+L to relock | ESC to clear
    color = $color8
    font_size = 12
    font_family = Noto Sans
    position = 0, 178
    halign = center
    valign = center
}
