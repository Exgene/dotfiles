general {
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 1.08
    brightness = 0.78
    vibrancy = 0.28
    vibrancy_darkness = 0.15
}

shape {
    monitor =
    size = 760, 420
    color = rgba(14, 18, 28, 0.58)
    rounding = 22
    border_size = 2
    border_color = rgba(120, 170, 255, 0.26)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 760, 420
    color = rgba(10, 12, 18, 0.20)
    rounding = 22
    border_size = 0
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(226, 232, 255, 0.96)
    font_size = 92
    font_family = Noto Sans
    position = 0, -114
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(176, 196, 255, 0.92)
    font_size = 20
    font_family = Noto Sans
    position = 0, -46
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba(214, 221, 245, 0.88)
    font_size = 19
    font_family = Noto Sans
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = 6
    outer_color = rgba(120, 170, 255, 0.55)
    inner_color = rgba(18, 24, 38, 0.78)
    font_color = rgba(237, 242, 255, 0.95)
    fade_on_empty = true
    placeholder_text = <i>Enter password</i>
    hide_input = false
    check_color = rgba(128, 214, 166, 0.95)
    fail_color = rgba(245, 120, 120, 0.95)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba(255, 212, 117, 0.9)
    numlock_color = -1
    bothlock_color = -1
    position = 0, 98
    halign = center
    valign = center
}

label {
    monitor =
    text = Caps Lock warning shows in amber
    color = rgba(164, 178, 214, 0.82)
    font_size = 13
    font_family = Noto Sans
    position = 0, 146
    halign = center
    valign = center
}

label {
    monitor =
    text = CTRL+ALT+L to relock | ESC to clear
    color = rgba(146, 160, 194, 0.80)
    font_size = 12
    font_family = Noto Sans
    position = 0, 178
    halign = center
    valign = center
}
