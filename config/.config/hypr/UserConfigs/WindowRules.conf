# rule to avoid idle for fullscreen apps
rule = class:^(*)$, idleinhibit:fullscreen
rule = title:^(*)$, idleinhibit:fullscreen
rule = fullscreen:1, idleinhibit:fullscreen

# rule move to workspace
# rule = class:^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr)$, workspace:2
rule = class:^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable)?)$, workspace:1
# rule = class:^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$, workspace:1
#rule = class:^([Tt]horium-browser)$, workspace:2
rule = class:^([Tt]hunar)$, workspace:3

# rule move to workspace (silent)
rule = class:^(virt-manager)$, workspace:6 silent
rule = class:^([Aa]udacious)$, workspace:9 silent

