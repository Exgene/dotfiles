[directory]
format = "[](fg:bg1)[ $path ]($style)[](fg:bg1) "
style = "bg:bg1 fg:blue"
truncation_length = 3
truncation_symbol = "../"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:bg1"
symbol = " "

[git_branch]
format = "[](fg:bg1)[ $symbol $branch ]($style)[](fg:bg1) "
style = "bg:bg1 fg:cyan"
symbol = ""

[git_status]
disabled = true
style = "bg:bg1 fg:red"
format = '[](fg:bg1)([ $all_status$ahead_behind ]($style))[](fg:bg1) '
up_to_date = '[ ✓ ](bg:bg1 fg:green)'
untracked = '[?\($count\)](bg:bg1 fg:yellow)'
stashed = '[$](bg:bg1 fg:blue)'
modified = '[!\($count\)](bg:bg1 fg:orange)'
renamed = '[»\($count\)](bg:bg1 fg:blue)'
deleted = '[✘\($count\)](bg:bg1 fg:red)'
staged = '[++\($count\)](bg:bg1 fg:green)'
ahead = '[⇡\(${count}\)](bg:bg1 fg:yellow)'
diverged = '⇕[\[](bg:bg1 fg:blue)[⇡\(${ahead_count}\)](bg:bg1 fg:yellow)[⇣\(${behind_count}\)](bg:bg1 fg:red)[\]](bg:bg1 fg:blue)'
behind = '[⇣\(${count}\)](bg:bg1 fg:red)'

[time]
disabled = false
format = "[](fg:bg1)[ $time 󰴈 ]($style)[](fg:bg1)"
style = "bg:bg1 fg:magenta"
time_format = "%I:%M%P"
use_12hr = true

[username]
disabled = false
# format = "[](fg:bg1)[ 󰧱 $user ]($style)[](fg:bg1) "
format = "[](fg:bg1)[ 󰧱 twitch.tv/_exgene ]($style)[](fg:bg1) "
show_always = true
style_root = "bg:bg1 fg:red"
style_user = "bg:bg1 fg:cyan"

# Languages

