# Monoglow
set -g @nova-nerdfonts true
set -g window-status-style fg=#cccccc,bg=#191919
set -g @nova-status-style-bg "#121212"
set -g @nova-status-style-fg "#cccccc"
set -g @nova-status-style-active-bg "#1bfd9c"
set -g @nova-status-style-active-fg "#080808"
set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"
set -g @nova-pane-active-border-style "#1bfd9c"
set -g @nova-pane-border-style "#444444"
set -g @nova-segment-mode "#{?client_prefix,Ω,ω}"
set -g @nova-segment-mode-colors "#1bfd9c #191919"
# set -g @nova-segment-whoami "#(whoami)-#h"
set -g @nova-segment-whoami "twitch.tv/_exgene"
set -g @nova-segment-whoami-colors "#66b2b2 #191919"
set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami"

